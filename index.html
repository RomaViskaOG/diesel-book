<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);

    ui.animate(dt => { if (id !== camAnim) return false; t += dt*1000; const k = Math.min(1, t / ms), e = ease(k); setCam(y0 + dy*e, p0 + (p - p0)*e); return k < 1; }); };
  ui.camTo = camTo;
  svg.addEventListener('pointerdown', e => { if (e.button || e.target.closest('[data-act]')) return;
    camAnim++; drag = { x:e.clientX, y:e.clientY, yaw:YAW, pitch:PITCH }; svg.classList.add("drag"); try { svg.setPointerCapture(e.pointerId); } catch {} });
  svg.addEventListener('pointermove', e => { if (!drag) return; const k = 300 / svg.getBoundingClientRect().width;
    setCam(drag.yaw + (e.clientX - drag.x)*.55*k, drag.pitch + (e.clientY - drag.y)*.35*k); ui.invalidate(); });
  const endDrag = () => { drag = null; svg.classList.remove('drag'); };
  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('dblclick', e => { if (!e.target.closest('[data-act]')) camTo(YAW0, PITCH0); });
  addEventListener('keydown', e => { const k = { ArrowLeft:[-15,0], ArrowRight:[15,0], ArrowUp:[0,8], ArrowDown:[0,-8] }[e.key];
    if (!k || window.GAME_KEYS || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); camTo(YAW + k[0], PITCH + k[1], 260); });   // a game figure keeps the arrows for play
  document.getElementById('vreset').onclick = () => { spin = false; vsp.setAttribute('aria-pressed', false); camTo(YAW0, PITCH0); };
  const vsp = document.getElementById('vspin');
  vsp.onclick = () => { spin = !spin; vsp.setAttribute('aria-pressed', spin); camAnim++;
    let dir = 1;   // with a turning limit, the turntable swings back and forth inside it
    if (spin) ui.animate(dt => { if (!spin) return false; if (!drag){ let y = YAW + dir*dt*18;
      if (CAM_LIM != null && Math.abs(y - YAW0) >= CAM_LIM - .5){ dir = -dir; y = YAW + dir*dt*18; } setCam(y, PITCH); } return true; }); };
  if (q.has('yaw') || q.has('pitch')) setCam(+(q.get('yaw') ?? YAW0), +(q.get('pitch') ?? PITCH0));
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');

  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);

  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

<script>
/* Generic diesel-electric locomotive prime mover — public knowledge only.
   Layout (x=depth, y=along loco toward viewer-left = roughly forward, z=up).
   Chain: fuel → injectors; air → turbo → intercooler → intake;
   4-stroke (intake/compression/injection/exhaust); exhaust → turbine;
   crankshaft → generator → rectifier → traction motors → wheels;
   cooling (radiator+fan) and lubrication.

   Typical values (labeled as typical, not a specific brand):
   Idle ~350 RPM, Notch 8 ~1000 RPM; generator ~0.3–3 MW class;
   boost ~0.2–2.0 bar gauge; peak cyl ~40–140 bar; coolant ~80–95°C.
*/
const W = 130, D = 240, H = 115;

/* ---- layout anchors ---- */
const FUEL  = { x0: 40, x1: 90, y0: 185, y1: 228, z0: 0,  z1: 22 };
const ENG   = { x0: 28, x1: 102,y0: 95,  y1: 175, z0: 18, z1: 78 };

const RECT  = { x0: 95, x1: 118,y0: 55,  y1: 90,  z0: 28, z1: 62 };
const RAD   = { x0: 35, x1: 95, y0: 210, y1: 235, z0: 28, z1: 95 };
const FAN   = { cx: 65, cy: 238, r: 18, z0: 40, z1: 82 };
const TURBO = { cx: 65, cy: 155, r: 14, z0: 82, z1: 102 };
const IC    = { x0: 42, x1: 88, y0: 168, y1: 188, z0: 72, z1: 90 };
const AFILT = { x0: 48, x1: 82, y0: 188, y1: 208, z0: 70, z1: 92 };
const STACK = { cx: 65, cy: 140, r: 7,  z0: 100, z1: 118 };
const TRUCK = { x0: 30, x1: 100,y0: 8,   y1: 48,  z0: 0,  z1: 28 };
const OIL   = { x0: 40, x1: 90, y0: 110, y1: 165, z0: 8,  z1: 20 };

const STEEL = { l:'#d8dde3', m:'#9aa3ad', d:'#5c6570' };
const BLUE  = { l:'#9ec4e8', m:'#5a8fbf', d:'#2f5578' };
const TEAL  = { l:'#8fd4c8', m:'#4fa899', d:'#2a6a60' };
const AMBER = { l:'#f0c56e', m:'#c9922e', d:'#7a5614' };
const REDM  = { l:'#e8927a', m:'#c45c3a', d:'#7a2e1c' };
const DARKM = { l:'#6a7078', m:'#3d434a', d:'#1e2228' };
const GREEN = { l:'#9dce7a', m:'#6a9e48', d:'#3a5e28' };
const FUELC = { l:'#c9a86a', m:'#8f6e32', d:'#4a3814' };
const FIREC = '#ffb060';

/* Cylinder along Y (generator barrel, crankshaft): centred (x,z), from y0 to y1. */
function cylY(y0,y1,x,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PY(y0),ellUV(x,z,r,r,n)), B=on(PY(y1),ellUV(x,z,r,r,n));
  const capB = vis([0,1,0]), cap = capB ? B : A, cn = capB ? [0,1,0] : [0,-1,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}

const boxAt = (b, m, inkW=1.4) => box(b.x0, b.y0, b.z0, b.x1, b.y1, b.z1, m, toneI, inkW);
const mid = (a,b) => (a+b)/2;
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* crank / piston geometry for 3 visible cylinders on near bank */
const CYL = [
  { x: 78, y: 120, z0: 38 },
  { x: 78, y: 138, z0: 38 },
  { x: 78, y: 156, z0: 38 },
];
const STROKE = 14;
const ROD = 22;
const CRANK_Z = 34;
const CRANK_Y0 = 112;

function pistonZ(theta){
  // theta rad: 0 = TDC-ish for cyl0; approx slider-crank
  return CRANK_Z + ROD + (STROKE/2)*Math.cos(theta);
}
function crankPin(theta, y){
  return [65, y, CRANK_Z + (STROKE/2)*Math.sin(theta)];
}

function scene(st, m){
  const k = ease(st.xr || 0);
  const page = st.page || 1;
  const th = st.theta || 0;
  const fuelFlow = st.fuelFlow || 0;
  const airFlow = st.airFlow || 0;
  const boost = st.boost || 0;
  const flame = st.flame || 0;
  const exhaust = st.exhaust || 0;
  const genSpin = st.genSpin || 0;
  const wheelA = st.wheelA || 0;
  const fanA = st.fanA || 0;
  const cool = st.cool || 0;
  const oilFlow = st.oilFlow || 0;
  const phase = st.phase || 0; // 0 idle/off, 1 fuel, 2 air, 3 intake, 4 comp, 5 comb, 6 exh, 7 powertrain, 8 cool, 9 run
  const notch = st.notch || 1;

  let parts = [];
  const floor = board(-10, -8, W+20, D+16, 3, 8);
  parts.push({ at:[W/2, D/2, 0], box:[[-10,-8,0],[W+20,D+16,2]], svg: floor });

  // ---- Fuel tank ----
  let fuel = boxAt(FUEL, FUELC, 1.8);
  fuel += box(FUEL.x0+4, FUEL.y0+4, FUEL.z1-4, FUEL.x1-4, FUEL.y1-4, FUEL.z1+2, DARKM, toneI, 1);
  if (fuelFlow > 0.05){
    fuel += fill(pd(on(PZ(FUEL.z1+3), ellUV(mid(FUEL.x0,FUEL.x1), mid(FUEL.y0,FUEL.y1), 8, 6, 12))), '#e8c878', `opacity="${f(fuelFlow*.4)}"`);
  }
  fuel = act('fuel', fuel);
  parts.push({ at:[mid(FUEL.x0,FUEL.x1), mid(FUEL.y0,FUEL.y1), mid(FUEL.z0,FUEL.z1)],
    box:[[FUEL.x0,FUEL.y0,FUEL.z0],[FUEL.x1,FUEL.y1,FUEL.z1]], svg:fuel });

  // fuel pump + line toward engine
  let fp = act('fpump', cyl(55, 180, 18, 34, 6, AMBER, toneI, 1.2, 14));
  fp += act('fpump', rod([55,180,26], [70,150,55], 1.4, STEEL));
  if (fuelFlow > 0.05){
    const tnow = st.playT || 0;
    let drops = '';
    for (let i=0;i<8;i++){
      const u = (i/8 + tnow*fuelFlow*0.35) % 1;
      const x = lerp(55, 72, u), y = lerp(180, 148, u), z = lerp(26, 55, u);
      drops += fill(pd(on(PZ(z), ellUV(x,y,1.2,1.2,6))), '#d4a84a', `opacity="${f(fuelFlow*(1-u)*.6)}"`);
    }
    fp += drops;
  }
  parts.push({ at:[55,180,26], box:[[48,145,18],[75,185,56]], svg:fp });

  // ---- Radiator + fan (front / high y) ----
  let rad = act('rad', boxAt(RAD, BLUE, 1.6));
  // louvers hint
  for (let i=0;i<6;i++){
    const zz = RAD.z0+8+i*10;
    rad += line([[RAD.x0+3,RAD.y1,zz],[RAD.x1-3,RAD.y1,zz]], .7);
  }
  parts.push({ at:[mid(RAD.x0,RAD.x1), mid(RAD.y0,RAD.y1), mid(RAD.z0,RAD.z1)],
    box:[[RAD.x0,RAD.y0,RAD.z0],[RAD.x1,RAD.y1,RAD.z1]], svg:rad });

  // fan blades
  let fanSvg = act('fan', cyl(FAN.cx, FAN.cy, FAN.z0, FAN.z1, 4, STEEL, toneI, 1.2, 12));
  for (let i=0;i<4;i++){
    const a = fanA + i*Math.PI/2;
    const x1 = FAN.cx + Math.cos(a)*16, z1 = mid(FAN.z0,FAN.z1) + Math.sin(a)*16;
    fanSvg += act('fan', rod([FAN.cx, FAN.cy, mid(FAN.z0,FAN.z1)], [x1, FAN.cy, z1], 1.5, TEAL));
  }
  fanSvg += act('fan', cyl(FAN.cx, FAN.cy, FAN.z0+8, FAN.z1-8, FAN.r, {l:'#b8d4e8',m:'#7aa8c4',d:'#3d6578'}, toneI, .8, 20));
  parts.push({ at:[FAN.cx, FAN.cy, mid(FAN.z0,FAN.z1)], box:[[FAN.cx-20,FAN.cy-4,FAN.z0],[FAN.cx+20,FAN.cy+4,FAN.z1]], svg:fanSvg });

  // coolant flow hint
  if (cool > 0.05){
    let coolSvg = '';
    for (let i=0;i<10;i++){
      const u = (i/10 + (st.playT||0)*cool*0.25) % 1;
      const y = lerp(RAD.y0, ENG.y1-5, u);
      const z = lerp(60, 50, u);
      coolSvg += fill(pd(on(PZ(z), ellUV(50, y, 1.3, 1.3, 6))), '#6ec4e8', `opacity="${f(cool*(1-u)*.5)}"`);
    }
    coolSvg = act('rad', coolSvg);
    parts.push({ at:[50, 190, 55], box:[[45,100,45],[55,220,65]], svg:coolSvg });
  }

  // ---- Air filter ----
  let af = act('afilt', boxAt(AFILT, GREEN, 1.4));
  af += act('afilt', rod([mid(AFILT.x0,AFILT.x1), AFILT.y0, mid(AFILT.z0,AFILT.z1)], [TURBO.cx+10, TURBO.cy+5, TURBO.z0+8], 2, STEEL));
  parts.push({ at:[mid(AFILT.x0,AFILT.x1), mid(AFILT.y0,AFILT.y1), mid(AFILT.z0,AFILT.z1)],
    box:[[AFILT.x0,AFILT.y0,AFILT.z0],[AFILT.x1,AFILT.y1,AFILT.z1]], svg:af });

  // ---- Intercooler ----
  let ic = act('inter', boxAt(IC, TEAL, 1.5));
  ic += act('inter', rod([mid(IC.x0,IC.x1), IC.y0, mid(IC.z0,IC.z1)], [TURBO.cx, TURBO.cy, TURBO.z0+6], 2.2, STEEL));
  ic += act('intake', rod([mid(IC.x0,IC.x1), IC.y0-2, IC.z0+4], [82, 150, 72], 2, STEEL));
  if (airFlow > 0.05){
    let air = '';
    for (let i=0;i<10;i++){
      const u = (i/10 + (st.playT||0)*airFlow*0.4) % 1;
      const x = lerp(AFILT.x0+10, TURBO.cx, Math.min(1,u*1.4));
      const y = lerp(AFILT.y0, TURBO.cy, Math.min(1,u*1.4));
      const z = lerp(AFILT.z0+8, TURBO.z0+6, Math.min(1,u*1.4));
      air += fill(pd(on(PZ(z), ellUV(x,y,1.4,1.4,6))), '#cfefff', `opacity="${f(airFlow*(1-u)*.55)}"`);
    }
    ic += air;
  }
  parts.push({ at:[mid(IC.x0,IC.x1), mid(IC.y0,IC.y1), mid(IC.z0,IC.z1)],
    box:[[IC.x0,IC.y0,IC.z0],[IC.x1,IC.y1,IC.z1]], svg:ic });

  // ---- Turbo ----
  let tb = act('turbo', cyl(TURBO.cx, TURBO.cy, TURBO.z0, TURBO.z1, TURBO.r, STEEL, toneI, 1.5, 20));
  tb += act('turbo', cyl(TURBO.cx, TURBO.cy, TURBO.z0+6, TURBO.z1-4, TURBO.r+4, DARKM, toneI, 1.2, 16));
  // compressor / turbine hint spin
  const tspin = (st.turboSpin||0);
  for (let i=0;i<5;i++){
    const a = tspin + i*Math.PI*2/5;
    tb += rod([TURBO.cx, TURBO.cy, TURBO.z0+10], [TURBO.cx+Math.cos(a)*10, TURBO.cy+Math.sin(a)*10, TURBO.z0+10], 1, AMBER);
  }
  parts.push({ at:[TURBO.cx, TURBO.cy, mid(TURBO.z0,TURBO.z1)],
    box:[[TURBO.cx-18,TURBO.cy-18,TURBO.z0],[TURBO.cx+18,TURBO.cy+18,TURBO.z1]], svg:tb });

  // exhaust stack
  let stack = act('exhaust', cyl(STACK.cx, STACK.cy, STACK.z0, STACK.z1, STACK.r, DARKM, toneI, 1.4, 14));
  stack += act('exhaust', rod([TURBO.cx-8, TURBO.cy, TURBO.z0+4], [STACK.cx, STACK.cy, STACK.z0], 2.5, STEEL));
  if (exhaust > 0.05){
    for (let i=0;i<6;i++){
      const u = (i/6 + (st.playT||0)*0.5) % 1;
      const zz = STACK.z1 + u*14;
      stack += fill(pd(on(PZ(zz), ellUV(STACK.cx, STACK.cy, 3+u*5, 3+u*5, 10))), '#8899aa', `opacity="${f(exhaust*(1-u)*.45)}"`);
    }
  }
  parts.push({ at:[STACK.cx, STACK.cy, mid(STACK.z0,STACK.z1)],
    box:[[STACK.cx-10,STACK.cy-10,STACK.z0],[STACK.cx+10,STACK.cy+10,STACK.z1+16]], svg:stack });

  // ---- Engine block (ghostable) ----
  const engProf = rrUV(ENG.y0, ENG.z0, ENG.y1, ENG.z1, 5);
  let engBody = extrude(engProf, ENG.x0, ENG.x1, BLUE);
  engBody += hullInk([...on(PX(ENG.x0), engProf), ...on(PX(ENG.x1), engProf)], 2.5);
  if (facing([1,0,0])) engBody += fill(pd(on(PX(ENG.x1), engProf)), tone([1,0,0], BLUE));
  // V-bank hint on top
  engBody += box(ENG.x0+8, ENG.y0+10, ENG.z1-8, ENG.x1-8, ENG.y1-10, ENG.z1+6, STEEL, toneI, 1.2);
  engBody = act('block', engBody);
  parts.push({ at:[mid(ENG.x0,ENG.x1), mid(ENG.y0,ENG.y1), mid(ENG.z0,ENG.z1)],
    box:[[ENG.x0,ENG.y0,ENG.z0],[ENG.x1,ENG.y1,ENG.z1+6]],
    svg: k>0 ? `<g opacity="${f(1-.6*k)}">${engBody}</g>` : engBody });

  // oil pan
  let oil = act('oil', boxAt(OIL, DARKM, 1.3));
  if (oilFlow > 0.05){
    let od = '';
    for (let i=0;i<8;i++){
      const u = (i/8 + (st.playT||0)*oilFlow*0.3) % 1;
      od += fill(pd(on(PZ(OIL.z1+1+u*8), ellUV(60+Math.sin(i)*10, 130+u*20, 1.2,1.2,6))), '#c4a030', `opacity="${f(oilFlow*.4)}"`);
    }
    oil += od;
  }
  parts.push({ at:[mid(OIL.x0,OIL.x1), mid(OIL.y0,OIL.y1), mid(OIL.z0,OIL.z1)],
    box:[[OIL.x0,OIL.y0,OIL.z0],[OIL.x1,OIL.y1,OIL.z1]], svg:oil });

  // ---- Internals: crank, pistons, valves, injectors (see-through / running) ----
  if (k > 0.12 || st.playing || phase >= 3 || page === 2){
    const op = Math.max(k, st.playing ? 0.85 : 0.35);
    let inn = '';

    // crankshaft along Y
    inn += act('crank', cylY(CRANK_Y0, ENG.y1-8, 65, CRANK_Z, 5, STEEL, toneI, 1.4, 16));
    // crank throws
    for (let i=0;i<3;i++){
      const yi = CYL[i].y;
      const thI = th + i * (Math.PI*2/3);
      const pin = crankPin(thI, yi);
      inn += act('crank', cyl(65, yi, CRANK_Z-3, CRANK_Z+3, 7, DARKM, toneI, 1, 12));
      inn += act('crank', rod([65, yi, CRANK_Z], pin, 2.5, STEEL));
      inn += act('crank', cyl(pin[0], pin[1], pin[2]-3, pin[2]+3, 3.5, AMBER, toneI, 1, 10));

      // connecting rod + piston
      const pz = pistonZ(thI);
      inn += act('piston', rod(pin, [CYL[i].x, yi, pz], 2, STEEL));
      inn += act('piston', cyl(CYL[i].x, yi, pz-2, pz+6, 8, TEAL, toneI, 1.2, 14));
      // cylinder liner ghost
      inn += cyl(CYL[i].x, yi, CRANK_Z+10, CRANK_Z+10+STROKE+ROD-4, 9.5, {l:'#c5d0dc',m:'#8a96a4',d:'#4a5560'}, toneI, .7, 16);

      // valves (intake / exhaust) — open by phase of this cyl
      // 4-stroke: use thI over 4π mapped
      const cyc = ((thI % (Math.PI*4)) + Math.PI*4) % (Math.PI*4);
      const intakeOpen = cyc < Math.PI;
      const exhaustOpen = cyc > Math.PI*3;
      const iv = intakeOpen ? 4 : 0;
      const ev = exhaustOpen ? 4 : 0;
      inn += act('intake', cyl(CYL[i].x-5, yi, pz+8+iv, pz+14+iv, 2.2, STEEL, toneI, .8, 8));
      inn += act('valve', cyl(CYL[i].x+5, yi, pz+8+ev, pz+14+ev, 2.2, DARKM, toneI, .8, 8));

      // injector
      inn += act('inj', cyl(CYL[i].x, yi, pz+10, pz+22, 2.5, REDM, toneI, 1, 8));
      // injection spray
      if (flame > 0.05 && cyc > Math.PI && cyc < Math.PI*1.4){
        inn += fill(pd(on(PZ(pz+4), ellUV(CYL[i].x, yi, 5, 5, 10))), FIREC, `opacity="${f(flame*.5)}"`);
        inn += fill(pd(on(PZ(pz+2), ellUV(CYL[i].x, yi, 3, 3, 8))), '#fff0c0', `opacity="${f(flame*.35)}"`);
      }
    }
    // glow on combustion globally
    if (flame > 0.15){
      inn += fill(pd(on(PZ(55), ellUV(78, 138, 22, 30, 16))), FIREC, `opacity="${f(flame*.18)}"`);
    }

    parts.push({ at:[70, 140, 50], box:[[55,110,25],[95,170,85]],
      svg:`<g opacity="${f(op)}">${inn}</g>` });
  }

  // ---- Generator ----
  let gen = act('gen', cylY(GEN.y0, GEN.y1, mid(GEN.x0,GEN.x1), mid(GEN.z0,GEN.z1), 22, STEEL, toneI, 1.8, 24));
  gen += act('gen', cylY(GEN.y0+4, GEN.y0+12, mid(GEN.x0,GEN.x1), mid(GEN.z0,GEN.z1), 24, DARKM, toneI, 1.2, 20));
  // coupling to crank
  gen += act('gen', cylY(GEN.y1-2, ENG.y0+4, 65, CRANK_Z, 4, AMBER, toneI, 1, 12));
  // spin stripes
  if (genSpin > 0.05){
    for (let i=0;i<6;i++){
      const a = genSpin + i*Math.PI/3;
      const zx = mid(GEN.z0,GEN.z1) + Math.cos(a)*14;
      const xx = mid(GEN.x0,GEN.x1) + Math.sin(a)*14;
      gen += rod([xx, GEN.y0+20, zx], [mid(GEN.x0,GEN.x1), GEN.y0+20, mid(GEN.z0,GEN.z1)], 1, TEAL);
    }
  }
  parts.push({ at:[mid(GEN.x0,GEN.x1), mid(GEN.y0,GEN.y1), mid(GEN.z0,GEN.z1)],
    box:[[GEN.x0,GEN.y0,GEN.z0],[GEN.x1,GEN.y1,GEN.z1]], svg:gen });

  // ---- Rectifier ----
  let rect = act('rect', boxAt(RECT, AMBER, 1.5));
  rect += act('rect', rod([GEN.x1, mid(GEN.y0,GEN.y1), mid(GEN.z0,GEN.z1)], [RECT.x0, mid(RECT.y0,RECT.y1), mid(RECT.z0,RECT.z1)], 2, STEEL));
  // cable down to motors
  rect += act('rect', rod([mid(RECT.x0,RECT.x1), RECT.y0, RECT.z0], [90, 35, 18], 1.8, {l:'#ef6a4c',m:'#cf5038',d:'#4a2219'}));
  parts.push({ at:[mid(RECT.x0,RECT.x1), mid(RECT.y0,RECT.y1), mid(RECT.z0,RECT.z1)],
    box:[[RECT.x0,RECT.y0,RECT.z0],[RECT.x1,RECT.y1,RECT.z1]], svg:rect });

  // ---- Truck, wheels, traction motors ----
  let truck = act('wheel', box(TRUCK.x0, TRUCK.y0+8, TRUCK.z0+10, TRUCK.x1, TRUCK.y1-8, TRUCK.z1, STEEL, toneI, 1.3));
  const wheelYs = [18, 38];
  for (const wy of wheelYs){
    // left and right wheels (x)
    for (const wx of [38, 92]){
      let wh = '';
      wh += cylX(wx-4, wx+4, wy, 12, 12, DARKM, toneI, 1.3, 16);
      // spokes rotate
      for (let i=0;i<4;i++){
        const a = wheelA + i*Math.PI/2;
        wh += rod([wx, wy + Math.cos(a)*8, 12 + Math.sin(a)*8], [wx, wy, 12], 1.2, STEEL);
      }
      truck += act('wheel', wh);
    }
    // axle
    truck += act('wheel', cylX(38, 92, wy, 12, 2.5, STEEL, toneI, 1, 10));
    // traction motor on axle
    truck += act('motor', cylX(55, 75, wy, 16, 8, TEAL, toneI, 1.3, 14));
  }
  // rail hint
  truck += box(20, 5, 0, 110, 7, 2, DARKM, toneI, .8);
  truck += box(20, 45, 0, 110, 47, 2, DARKM, toneI, .8);
  parts.push({ at:[mid(TRUCK.x0,TRUCK.x1), mid(TRUCK.y0,TRUCK.y1), 12],
    box:[[TRUCK.x0,TRUCK.y0,0],[TRUCK.x1,TRUCK.y1,TRUCK.z1]], svg:truck });

  // cast shadow
  const shPts = [];
  for (const b of [FUEL, ENG, GEN, RECT, RAD, OIL, TRUCK, IC, AFILT]) {
    shPts.push([b.x0,b.y0,b.z1||b.z0+20],[b.x1,b.y0,b.z1||b.z0+20],[b.x0,b.y1,b.z1||b.z0+20],[b.x1,b.y1,b.z1||b.z0+20]);
  }
  shPts.push([TURBO.cx, TURBO.cy, TURBO.z1], [FAN.cx, FAN.cy, FAN.z1]);
  let s = castShadow(shPts, 3, boardTop(-10,-8,W+20,D+16,3,8));
  s += byDepth(parts);

  // labels
  const labelsOn = !document.documentElement.classList.contains('nolabels');
  const items = [];
  const add = (key, at, on) => items.push({ at, text: PARTS[key].name, on: !!on, key });
  if (k > .5 || page === 2){
    const mobile = typeof innerWidth === 'number' && innerWidth <= 560;
    add('fuel', [mid(FUEL.x0,FUEL.x1), FUEL.y1-2, 14], fuelFlow>0.2);
    add('turbo', [TURBO.cx+TURBO.r, TURBO.cy, 98], airFlow>0.2 || exhaust>0.2);
    add('piston', [CYL[1].x+12, CYL[1].y, 58], phase>=3 && phase<=6);
    add('crank', [55, 118, 30], phase>=3);
    add('exhaust', [STACK.cx+8, STACK.cy, STACK.z1], exhaust>0.2);
    add('gen', [GEN.x1, mid(GEN.y0,GEN.y1), 48], genSpin>0.2 || phase>=7);
    add('rad', [RAD.x0-2, mid(RAD.y0,RAD.y1), 72], cool>0.2 || phase<=2);
    add('wheel', [98, 30, 14], st.speedKmh>1 || phase>=7);
    add('block', [ENG.x0-2, mid(ENG.y0,ENG.y1), 58], true);
    if (!mobile || page === 2){
      add('fpump', [48, 178, 36], fuelFlow>0.2);
      add('inj', [88, 138, 72], flame>0.2);
      add('afilt', [mid(AFILT.x0,AFILT.x1), AFILT.y1+2, 86], airFlow>0.2);
      add('inter', [IC.x1+2, mid(IC.y0,IC.y1), 84], airFlow>0.2);
      add('intake', [94, 152, 76], phase===3);
      add('valve', [90, 158, 74], phase===6);
      add('rect', [RECT.x1+2, mid(RECT.y0,RECT.y1), 46], genSpin>0.2);
      add('motor', [72, 16, 22], st.speedKmh>1);
      add('fan', [FAN.cx+20, FAN.cy, 62], cool>0.2);
      add('oil', [OIL.x0-2, mid(OIL.y0,OIL.y1), 16], oilFlow>0.2);
    }
    s += xrCallouts(items.map(({at,text,on}) => ({at,text,on})), [0, W, 0, D, 0, H]);
  } else if (labelsOn){
    const surf = [
      { at:[mid(FUEL.x0,FUEL.x1), FUEL.y1, 18], text:'דלק' },
      { at:[ENG.x1, 140, 55], text:'מנוע' },
      { at:[GEN.x1, 70, 50], text:'גנרטור' },
      { at:[RAD.x0, 220, 70], text:'קירור' },
      { at:[92, 30, 16], text:'גלגלים' },
    ];
    for (const t of surf) s += tag(t.at, 12, -10, t.text, false);
  }
  return s;
}

/* ---------- notch model (typical values) ---------- */
function notchTargets(n){
  n = clamp(n|0, 1, 8);
  // Idle-ish at 1 → full at 8. Typical mid-size freight locomotive class.
  const rpm = Math.round(lerp(350, 1000, (n-1)/7));
  const kw = Math.round(lerp(200, 3000, (n-1)/7)); // generator electrical output, typical range
  const boost = +(lerp(0.15, 1.8, (n-1)/7)).toFixed(2); // bar gauge
  const cylP = Math.round(lerp(40, 140, (n-1)/7)); // bar peak, typical
  const temp = Math.round(lerp(75, 92, (n-1)/7)); // coolant °C
  const speed = Math.round(lerp(5, 100, (n-1)/7)); // km/h under load, illustrative
  return { rpm, kw, boost, cylP, temp, speed };
}

function applyNotchReadouts(st){
  const t = notchTargets(st.notch || 1);
  const run = st.phase >= 7 || st.running ? 1 : (st.phase >= 3 ? 0.5 : 0.05);
  st.rpm = Math.round(t.rpm * (st.rpmFactor != null ? st.rpmFactor : run));
  st.kw = Math.round(t.kw * (st.kwFactor != null ? st.kwFactor : (st.phase >= 7 || st.running ? run : 0)));
  st.boost = +(t.boost * (st.boostFactor != null ? st.boostFactor : (st.airFlow || run*0.5))).toFixed(2);
  st.cylP = Math.round(t.cylP * (st.cylFactor != null ? st.cylFactor : (st.flame > 0.2 ? 1 : 0.25*run + 0.15)));
  st.tempC = Math.round(lerp(40, t.temp, st.cool > 0 ? 0.7 + 0.3*run : run));
  st.speedKmh = Math.round(t.speed * (st.speedFactor != null ? st.speedFactor : (st.phase >= 7 || st.running ? run : 0)));
}

/* ---------- timeline ---------- */
const SEG = [
  { id:1, dur:2.4, msg:'דלק: מהמיכל דרך המשאבה אל המזרקים' },
  { id:2, dur:2.6, msg:'אוויר: מסנן → מגדש → מקרר ביניים → יניקה' },
  { id:3, dur:2.2, msg:'מהלך יניקה — שסתום יניקה פתוח, בוכנה יורדת' },
  { id:4, dur:2.2, msg:'מהלך דחיסה — שסתומים סגורים, לחץ עולה' },
  { id:5, dur:2.4, msg:'הזרקה ובעירה — המזרק מתיז, הבוכנה נדחפת למטה' },
  { id:6, dur:2.4, msg:'פליטה — גזים חמים מניעים את טורבינת המגדש' },
  { id:7, dur:2.8, msg:'הספק: גל ארכובה → גנרטור → מיישר → מנועי משיכה → גלגלים' },
  { id:8, dur:2.2, msg:'קירור ושימון — רדיאטור, מאוורר ושמן מסתובבים' },
  { id:9, dur:3.2, msg:'עבודה רציפה במצב המצערת שנבחר — המחזור חוזר' },
];
const TOTAL = SEG.reduce((a,s)=>a+s.dur,0);

function segAt(t){
  let acc = 0;
  for (const s of SEG){
    if (t < acc + s.dur) return { id:s.id, local:(t-acc)/s.dur, msg:s.msg, dur:s.dur };
    acc += s.dur;
  }
  const last = SEG[SEG.length-1];
  return { id:last.id, local:1, msg:last.msg, dur:last.dur };
}

function applyAt(st, t){
  t = clamp(t, 0, TOTAL);
  st.playT = t;
  const { id, local, msg } = segAt(t);
  const e = ease(local);
  st.msg = msg;
  st.step = id;
  highlightStep(st.step);

  // defaults
  st.fuelFlow = 0; st.airFlow = 0; st.flame = 0; st.exhaust = 0;
  st.cool = 0; st.oilFlow = 0; st.running = false;
  st.rpmFactor = 0.05; st.kwFactor = 0; st.boostFactor = 0; st.cylFactor = 0.15; st.speedFactor = 0;

  const nT = notchTargets(st.notch || 1);
  const rpmFrac = (nT.rpm - 350) / (1000 - 350);

  if (id === 1){
    st.phase = 1;
    st.fuelFlow = e;
    st.theta = lerp(0, Math.PI*0.3, e);
    st.fanA = 0; st.wheelA = 0; st.genSpin = 0; st.turboSpin = 0;
    st.rpmFactor = 0.1; st.cylFactor = 0.2;
  } else if (id === 2){
    st.phase = 2;
    st.fuelFlow = 0.5; st.airFlow = e;
    st.turboSpin = e * (2 + rpmFrac*4) * Math.PI * 2 * (st.playT||0);
    st.theta = lerp(Math.PI*0.3, Math.PI*0.6, e);
    st.boostFactor = e; st.rpmFactor = 0.2;
  } else if (id === 3){
    st.phase = 3;
    st.fuelFlow = 0.4; st.airFlow = 0.7;
    // intake: theta 0 → π
    st.theta = lerp(0, Math.PI, e);
    st.turboSpin = (2+rpmFrac*4)*Math.PI*2*(st.playT||0);
    st.rpmFactor = 0.35; st.boostFactor = 0.6; st.cylFactor = 0.25;
  } else if (id === 4){
    st.phase = 4;
    st.fuelFlow = 0.4; st.airFlow = 0.7;
    st.theta = lerp(Math.PI, Math.PI*2, e);
    st.turboSpin = (2+rpmFrac*4)*Math.PI*2*(st.playT||0);
    st.rpmFactor = 0.45; st.boostFactor = 0.7; st.cylFactor = lerp(0.3, 0.85, e);
  } else if (id === 5){
    st.phase = 5;
    st.fuelFlow = 1; st.airFlow = 0.8; st.flame = e;
    st.theta = lerp(Math.PI*2, Math.PI*3, e);
    st.turboSpin = (3+rpmFrac*5)*Math.PI*2*(st.playT||0);
    st.rpmFactor = 0.7; st.boostFactor = 0.85; st.cylFactor = 1; st.kwFactor = e*0.4;
  } else if (id === 6){
    st.phase = 6;
    st.fuelFlow = 0.7; st.airFlow = 0.8; st.flame = 1-e*0.5; st.exhaust = e;
    st.theta = lerp(Math.PI*3, Math.PI*4, e);
    st.turboSpin = (4+rpmFrac*6)*Math.PI*2*(st.playT||0);
    st.rpmFactor = 0.8; st.boostFactor = 1; st.cylFactor = 0.5; st.kwFactor = 0.5;
  } else if (id === 7){
    st.phase = 7;
    st.fuelFlow = 0.8; st.airFlow = 0.9; st.flame = 0.6; st.exhaust = 0.8;
    st.theta = Math.PI*4 * e * (2 + rpmFrac*3) + (st.playT||0) * (1+rpmFrac*2);
    st.genSpin = e * Math.PI * 4 * (st.playT||0);
    st.wheelA = e * Math.PI * 2 * (st.playT||0) * (0.5+rpmFrac);
    st.turboSpin = (5+rpmFrac*6)*Math.PI*2*(st.playT||0);
    st.rpmFactor = 0.9; st.kwFactor = e; st.boostFactor = 1; st.cylFactor = 0.9; st.speedFactor = e;
  } else if (id === 8){
    st.phase = 8;
    st.fuelFlow = 0.8; st.airFlow = 0.9; st.flame = 0.55; st.exhaust = 0.7;
    st.cool = e; st.oilFlow = e;
    st.fanA = e * Math.PI * 3 * (st.playT||0);
    st.theta = (st.playT||0) * (2+rpmFrac*3);
    st.genSpin = Math.PI * 3 * (st.playT||0);
    st.wheelA = Math.PI * 1.5 * (st.playT||0) * (0.5+rpmFrac);
    st.turboSpin = (5+rpmFrac*6)*Math.PI*2*(st.playT||0);
    st.rpmFactor = 1; st.kwFactor = 1; st.boostFactor = 1; st.cylFactor = 0.85; st.speedFactor = 1;
  } else if (id === 9){
    st.phase = 9; st.running = true;
    st.fuelFlow = 0.85; st.airFlow = 0.95; st.flame = 0.5 + 0.3*Math.sin((st.playT||0)*4);
    st.exhaust = 0.85; st.cool = 1; st.oilFlow = 1;
    const spin = (st.playT||0) * (2.5 + rpmFrac*4);
    st.theta = spin;
    st.fanA = spin * 1.2;
    st.genSpin = spin * 1.1;
    st.wheelA = spin * 0.6;
    st.turboSpin = spin * 2.5;
    st.rpmFactor = 1; st.kwFactor = 1; st.boostFactor = 1; st.cylFactor = 0.9; st.speedFactor = 1;
  }
  applyNotchReadouts(st);
}

let ui, busy=false, playHandle=false;

function highlightStep(n){
  const host = document.getElementById('btns'); if (!host) return;
  host.querySelectorAll('.act').forEach(b => {
    const m = /^(\d+)/.exec(b.textContent.trim());
    b.classList.toggle('step-on', !!(m && +m[1] === n));
  });
}
function stopPlay(st, resetClock){
  st.playing = false; st.paused = false; playHandle = false;
  syncPlayBar();
  if (resetClock){ st.playT = 0; }
}
function tickPlay(dt){
  const st = ui.st;
  if (!st.playing || st.paused) return false;
  st.playT = (st.playT || 0) + dt * (st.speed || 1);
  if (st.playT >= TOTAL){
    st.playT = TOTAL;
    applyAt(st, st.playT);
    st.playing = false; st.paused = false; playHandle = false;
    st.msg = 'המחזור הושלם · לחצו נגן שוב או איפוס';
    syncPlayBar(); highlightStep(st.step);
    return false;
  }
  applyAt(st, st.playT);
  return true;
}
function startPlay(st){
  if (st.page !== 1){ st.page = 1; syncTabs(); }
  if (!st.xr){ st.xrT = 1; ui.animate(d => { const g=Math.sign(1-(st.xr||0)); st.xr=Math.min(1,Math.max(0,(st.xr||0)+g*d/.6)); return st.xr!==1; }); }
  else { st.xr = st.xrT = 1; }
  if (busy) busy=false;
  if (st.playT >= TOTAL - 0.05) st.playT = 0;
  st.playing = true; st.paused = false;
  if (st.playT < 0.05){ resetPose(st); st.playT = 0; }
  syncPlayBar();
  if (!playHandle){
    playHandle = true;
    ui.animate(dt => tickPlay(dt));
  }
}
function togglePause(st){
  if (!st.playing && !st.paused){ startPlay(st); return; }
  if (st.playing && !st.paused){ st.paused = true; st.playing = false; syncPlayBar(); return; }
  if (st.paused){ st.paused = false; st.playing = true; syncPlayBar(); if (!playHandle){ playHandle=true; ui.animate(dt => tickPlay(dt)); } }
}
function setSpeed(st, s){ st.speed = s; syncPlayBar(); }
function syncPlayBar(){
  const st = ui && ui.st; if (!st) return;
  const play = document.getElementById('btn-play');
  const pause = document.getElementById('btn-pause');
  if (play) play.setAttribute('aria-pressed', String(!!st.playing && !st.paused));
  if (pause) pause.setAttribute('aria-pressed', String(!!st.paused));
  document.querySelectorAll('.playbar .spd').forEach(b => {
    b.setAttribute('aria-pressed', String(+b.dataset.spd === (st.speed||1)));
  });
}
function resetPose(st){
  Object.assign(st, {
    phase:0, fuelFlow:0, airFlow:0, flame:0, exhaust:0, cool:0, oilFlow:0,
    theta:0, fanA:0, wheelA:0, genSpin:0, turboSpin:0, running:false,
    rpm:0, kw:0, boost:0, cylP:0, tempC:40, speedKmh:0,
    rpmFactor:0, kwFactor:0, boostFactor:0, cylFactor:0.1, speedFactor:0,
    playT:0
  });
  applyNotchReadouts(st);
}

function checkBreak(st, n){
  if (st.breakCooling && (n === 5 || n === 9 || n === 8)){
    return 'נכשל: מערכת הקירור כבויה — הטמפרטורה מזנקת. הפעילו קירור לפני עומס גבוה.';
  }
  if (st.breakFuel && (n === 1 || n === 5 || n === 9)){
    return 'נכשל: אין אספקת דלק — המזרקים יבשים. בדקו משאבה ומיכל.';
  }
  if (st.breakOil && (n === 7 || n === 9)){
    return 'נכשל: לחץ שמן נמוך — סיכון למיסבים. הפסיקו והפעילו שימון.';
  }
  if (st.notch >= 8 && st.breakCooling){
    return 'נכשל: מצב 8 בלי קירור — עומס יתר תרמי.';
  }
  return null;
}

function goStep(st, n){
  if (st.playing || st.paused) stopPlay(st, false);
  const fail = checkBreak(st, n);
  if (fail){ ui.flash(fail, 2800); return; }
  busy = true;
  const t0 = performance.now();
  const dur = [0,1600,1800,1600,1600,1800,1800,2000,1600,2200][n] || 1500;
  const segIndex = n - 1;
  const tBase = SEG.slice(0, Math.max(0,segIndex)).reduce((x,s)=>x+s.dur,0);
  const tSpan = SEG[segIndex] ? SEG[segIndex].dur : 1.5;
  if (!st.xr){ st.xrT = 1; st.xr = 1; }
  ui.animate(dt => {
    const el = performance.now() - t0;
    const u = clamp(el / dur, 0, 1);
    applyAt(st, tBase + u * tSpan);
    st.step = n; highlightStep(n);
    if (u >= 1){ busy = false; return false; }
    return true;
  });
}

function resetAll(st){
  stopPlay(st, true);
  Object.assign(st, {
    step:0, page: st.page||1, notch: st.notch||4,
    breakCooling: !!st.breakCooling, breakFuel: !!st.breakFuel, breakOil: !!st.breakOil,
    speed: st.speed || 1, playing:false, paused:false,
    msg:'מוכנים להתחיל · לחצו נגן', xr: st.xr||0, xrT: st.xrT||0
  });
  resetPose(st);
  busy=false; highlightStep(0); syncPlayBar(); ui.render();
}

function syncTabs(){
  document.querySelectorAll('.page-tabs button').forEach(b => {
    b.setAttribute('aria-pressed', String(+b.dataset.page === (ui.st.page||1)));
  });
}

function showPart(key){
  const p = PARTS[key]; if (!p) return;
  const el = document.getElementById('part-panel');
  el.innerHTML = `<button class="close" type="button" aria-label="סגור">✕</button>
    <h3>${p.name}</h3>
    <p>${p.what}</p>
    <p class="why"><strong>למה זה חשוב:</strong> ${p.role}</p>`;
  el.classList.add('open');
  el.querySelector('.close').onclick = () => el.classList.remove('open');
}

function hebraizeControls(){
  const map = [
    ['#xrb', 'שקוף'],
    ['#lblb', 'תוויות'],
    ['#vreset', 'מבט קדמי'],
    ['#vspin', 'סיבוב'],
  ];
  for (const [sel, he] of map){ const el = document.querySelector(sel); if (el) el.textContent = he; }
  document.querySelectorAll('.controls label').forEach(l => {
    const t = l.textContent.trim();
    if (t === 'Colour' || t === 'Color') l.textContent = 'צבע';
    else if (t === 'View') l.textContent = 'מבט';
    else if (t === 'Labels') l.textContent = 'תוויות';
    else if (/Hand-drawn|wobble/i.test(t)) l.textContent = 'רעד יד';
  });
  const lbl = document.getElementById('lbl');
  if (lbl){
    const sync = () => { lbl.textContent = document.documentElement.classList.contains('nolabels') ? 'כבוי' : 'דלוק'; };
    lbl.addEventListener('click', () => setTimeout(sync, 0));
    sync();
  }
}

function setNotch(st, n){
  st.notch = clamp(n,1,8);
  applyNotchReadouts(st);
  if (st.running || st.phase >= 7){
    // refresh factors for live notch change during run
    applyAt(st, st.playT || TOTAL - 0.5);
  }
  ui.render();
}

  playbar.after(note);
  const panel = document.createElement('div');
  panel.id = 'part-panel';
  document.body.appendChild(panel);
  if ((ui.st.page||1) === 2) {
    ui.st.xr = ui.st.xrT = 1;
  }
  const q0 = new URLSearchParams(location.search);
  const tJump = q0.has('t') ? +q0.get('t') : null;
  if (tJump == null) resetPose(ui.st);
  else {
    ui.st.xr = ui.st.xrT = 1;
    applyAt(ui.st, tJump);

  syncTabs();
  syncPlayBar();
  setTimeout(hebraizeControls, 0);
  setTimeout(hebraizeControls, 300);
  if (ui.st._autoplay){ setTimeout(() => startPlay(ui.st), 400); }
  ui.render();
})();
